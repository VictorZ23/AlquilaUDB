<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>

    <title>Viviendas con JPA - AlquilaUDB</title>

    <meta charset="UTF-8" />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 35px;
            background-color: #f5f6fa;
            color: #243b55;
        }

        h1 {
            color: #243b55;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #243b55;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .enlaces {
            margin: 20px 0;
        }

        .enlaces a {
            margin-right: 18px;
        }

        .acciones {
            white-space: nowrap;
        }

        .editar {
            font-weight: bold;
            color: #245c9a;
            margin-right: 12px;
        }

        .resenas {
            font-weight: bold;
            color: #287a49;
            margin-right: 12px;
        }

        .eliminar {
            background-color: #b02a37;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .eliminar:hover {
            background-color: #842029;
        }

        .error {
            color: #b00020;
            font-weight: bold;
            margin: 12px 0;
        }

        .sin-registros {
            padding: 15px;
            background-color: white;
            border: 1px solid #ddd;
        }
    </style>

</h:head>

<h:body>

    <h1>AlquilaUDB - Viviendas con JPA</h1>

    <p>
        Listado obtenido mediante JSF, CDI y Hibernate.
    </p>

    <!-- ENLACES PRINCIPALES -->

    <div class="enlaces">

        <h:link
            outcome="/registrar-vivienda"
            value="Registrar nueva vivienda" />

        <a href="vivienda">
            Ver listado anterior (JDBC)
        </a>

    </div>

    <!-- FORMULARIO DE ACCIONES -->

    <h:form id="formularioListado">

        <h:messages
            globalOnly="true"
            styleClass="error" />

        <!-- MENSAJE SIN VIVIENDAS -->

        <h:panelGroup
            rendered="#{empty viviendaJpaBean.viviendas}">

            <div class="sin-registros">
                No hay viviendas registradas.
            </div>

        </h:panelGroup>

        <!-- TABLA PRINCIPAL -->

        <h:dataTable
            id="tablaViviendas"
            value="#{viviendaJpaBean.viviendas}"
            var="v"
            rendered="#{not empty viviendaJpaBean.viviendas}">

            <!-- IDENTIFICADOR -->

            <h:column>

                <f:facet name="header">ID</f:facet>

                <h:outputText value="#{v.id}" />

            </h:column>

            <!-- TITULO -->

            <h:column>

                <f:facet name="header">Título</f:facet>

                <h:outputText value="#{v.titulo}" />

            </h:column>

            <!-- TIPO -->

            <h:column>

                <f:facet name="header">Tipo</f:facet>

                <h:outputText value="#{v.tipo}" />

            </h:column>

            <!-- ZONA -->

            <h:column>

                <f:facet name="header">Zona</f:facet>

                <h:outputText value="#{v.zona}" />

            </h:column>

            <!-- PRECIO -->

            <h:column>

                <f:facet name="header">Precio</f:facet>

                <h:outputText value="#{v.precio}">

                    <f:convertNumber
                        minFractionDigits="2"
                        maxFractionDigits="2" />

                </h:outputText>

            </h:column>

            <!-- HABITACIONES -->

            <h:column>

                <f:facet name="header">Habitaciones</f:facet>

                <h:outputText
                    value="#{v.habitaciones}" />

            </h:column>

            <!-- DISPONIBILIDAD -->

            <h:column>

                <f:facet name="header">Disponible</f:facet>

                <h:outputText
                    value="#{v.disponible ? 'Sí' : 'No'}" />

            </h:column>

            <!-- ACCIONES -->

            <h:column>

                <f:facet name="header">Acciones</f:facet>

                <h:panelGroup
                    layout="block"
                    styleClass="acciones">

                    <!-- EDITAR VIVIENDA -->

                    <h:link
                        outcome="/editar-vivienda"
                        value="Editar"
                        styleClass="editar">

                        <f:param
                            name="id"
                            value="#{v.id}" />

                    </h:link>

                    <!-- VER RESEÑAS -->

                    <h:link
                        outcome="/resenas"
                        value="Ver reseñas"
                        styleClass="resenas">

                        <f:param
                            name="id"
                            value="#{v.id}" />

                    </h:link>

                    <!-- ELIMINAR VIVIENDA -->

                    <h:commandButton
                        value="Eliminar"
                        action="#{viviendaJpaBean.eliminar(v.id)}"
                        styleClass="eliminar"
                        onclick="return confirm('¿Deseas eliminar esta vivienda? Esta acción no se puede deshacer.');" />

                </h:panelGroup>

            </h:column>

        </h:dataTable>

    </h:form>

</h:body>
</html>
